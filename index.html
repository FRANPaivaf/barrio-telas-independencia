<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio - Barrio de las Telas Independencia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Barrio de las Telas - Independencia</h1>
        <p>Encuentra las mejores tiendas, telas y ubicaciones del sector</p>
    </header>

    <main>
        <section id="contenedor-tiendas" class="galeria">
            <!-- Aquí agregaremos las tarjetas de los locales comerciales -->
        <section id="contenedor-tiendas" class="galeria">
    
    <!-- Tarjeta 1 -->
    <article class="tarjeta-tienda" data-id="1">
        <img src="img/tienda1.jpg" alt="Local Telas Independencia">
        <div class="info-tarjeta">
            <h3>Telas La Elegancia</h3>
            <p class="rubro">Especialidad: Sedas y Lino</p>
            <p class="direccion">📍 Av. Independencia #1234</p>
            <button class="btn-ver-mas">Ver detalles y mapa</button>
        </div>
    </article>

    <!-- Tarjeta 2 -->
    <article class="tarjeta-tienda" data-id="2">
        <img src="img/tienda2.jpg" alt="Local Telas Importadas">
        <div class="info-tarjeta">
            <h3>El Rey del Algodón</h3>
            <p class="rubro">Especialidad: Algodón y Mezclilla</p>
            <p class="direccion">📍 Av. Independencia #1560</p>
            <button class="btn-ver-mas">Ver detalles y mapa</button>
        </div>
    </article>

</section>
        
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
